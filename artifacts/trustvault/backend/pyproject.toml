
[project]
name = "trustvault-api"
version = "0.1.0"
description = "FastAPI backend for the TrustVault document-sharing platform"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "clerk-backend-api>=1",
  "email-validator>=2.2",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
